image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: "tcp://docker:2375"

stages:
  - test
  - push
  - deploy

test_backend:
  stage: test
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - echo "Building containers..."
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml -p drugovery-ci build
    - echo "Running Python tests..."
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml -p drugovery-ci run -T --rm backend pytest tests/
  after_script:
    - echo "Cleaning up containers..."
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml -p drugovery-ci down -v

push_to_dockerhub:
  stage: push
  only:
    - DevOps
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - echo "Logging into Docker Hub..."
    - echo "$DOCKER_PWD" | docker login -u "$DOCKER_USER" --password-stdin

    - echo "Rebuilding images for pushing..."
    - docker compose -f docker-compose.yml -f docker-compose.ci.yml -p drugovery-ci build

    - echo "Tagging Images..."
    - docker tag drugovery-ci-backend $DOCKER_USER/drugovery-backend:latest
    - docker tag drugovery-ci-frontend $DOCKER_USER/drugovery-frontend:latest
    - docker tag drugovery-ci-celery-worker $DOCKER_USER/drugovery-celery-worker:latest

    - echo "Pushing Images to Docker Hub..."
    - docker push $DOCKER_USER/drugovery-backend:latest
    - docker push $DOCKER_USER/drugovery-frontend:latest
    - docker push $DOCKER_USER/drugovery-celery-worker:latest

k8s_deploy:
  stage: deploy
  only:
    - DevOps
  script:
    - echo "Logging into Docker Hub to pull the image..."
    - echo "$DOCKER_PWD" | docker login -u "$DOCKER_USER" --password-stdin

    - echo "Deploying images to the cluster..."
    - docker run -d -p 8080:8080 --name drugovery-app "$DOCKER_USER/drugovery-backend:latest"
